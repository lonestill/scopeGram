name: Build and publish Scopegram

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag. Leave empty to generate one."
        required: false
        type: string
      prerelease:
        description: "Publish as a prerelease"
        required: false
        default: false
        type: boolean
      precompiled_tag:
        description: "Tag containing precompiled-core-macos-arm64.tar.gz"
        required: false
        default: "precompiled-latest"
        type: string

concurrency:
  group: scopegram-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build macOS arm64 release
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve release metadata
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            tag="v$(date -u +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}"
          fi

          if [[ "$tag" != v* ]]; then
            tag="v$tag"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+([.][0-9A-Za-z-]+)*$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi

          version="${tag#v}"
          bundle_version="${version%%-*}"
          if [[ ! "$bundle_version" =~ ^[0-9]+([.][0-9]+){1,2}$ ]]; then
            echo "The numeric part of the version must contain 2 or 3 components: $bundle_version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$bundle_version" >> "$GITHUB_OUTPUT"
          echo "prerelease=${INPUT_PRERELEASE:-false}" >> "$GITHUB_OUTPUT"
          echo "Building Scopegram $tag"

      - name: Apply Scopegram submodule patch
        run: |
          patch="scripts/patches/telegram-ios-scopegram.patch"
          if [[ -f "$patch" ]]; then
            if git -C submodules/telegram-ios apply --check "../../$patch"; then
              git -C submodules/telegram-ios apply "../../$patch"
            else
              echo "Submodule patch is already present or no longer required."
            fi
          fi

      - name: Install build dependencies
        run: |
          brew install cmake ninja meson nasm yasm openssl@3 zlib autoconf libtool automake pkg-config
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Restore native framework cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            core-xprojects/OpenH264/build
            core-xprojects/OpenSSLEncryption/build
            core-xprojects/OpenSSL/build
            core-xprojects/openssl/build
            core-xprojects/libopus/build
            core-xprojects/libvpx/build
            core-xprojects/mozjpeg/build
            core-xprojects/Mozjpeg/build
            core-xprojects/libwebp/build
            core-xprojects/dav1d/build
            core-xprojects/ffmpeg/build
            core-xprojects/webrtc/build
            core-xprojects/tde2e/build
            core-xprojects/wallet-engine/build
            core-xprojects/mtproto-engine/build
            core-xprojects/tlottie/build
            packages/WalletEngine/wallet_engineFFI.xcframework
            submodules/telegram-ios/submodules/MTProtoRustEngine/MTProtoEngineFFI.xcframework
            submodules/telegram-ios/submodules/OpusBinding/SharedHeaders
            submodules/telegram-ios/submodules/FFMpegBinding/SharedHeaders
            submodules/tgcalls/SharedHeaders
            submodules/libwebp/SharedHeaders
            submodules/telegram-ios/submodules/OpenSSLEncryptionProvider/SharedHeaders
            submodules/Mozjpeg/SharedHeaders
            submodules/telegram-ios/third-party/td/TdBinding/SharedHeaders
          key: scopegram-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup_build_env.sh', 'scripts/configure_frameworks.sh', 'core-xprojects/**/*.sh', 'core-xprojects/**/*.py', 'core-xprojects/**/CMakeLists.txt', 'submodules/**/Cargo.lock') }}
          restore-keys: |
            scopegram-native-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore precompiled native frameworks
        if: steps.native-cache.outputs.cache-matched-key == ''
        id: precompiled
        env:
          GH_TOKEN: ${{ github.token }}
          PRECOMPILED_TAG: ${{ inputs.precompiled_tag || 'precompiled-latest' }}
        run: |
          archive="$RUNNER_TEMP/precompiled-core-macos-arm64.tar.gz"
          if gh release download "$PRECOMPILED_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "precompiled-core-macos-arm64.tar.gz" \
            --output "$archive"; then
            tar -xzf "$archive" -C "$GITHUB_WORKSPACE"
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "Precompiled frameworks were not found; building them from source."
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build native frameworks from source
        if: steps.native-cache.outputs.cache-matched-key == '' && steps.precompiled.outputs.restored != 'true'
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
        run: sh scripts/setup_build_env.sh --build

      - name: Save native framework cache
        if: steps.native-cache.outputs.cache-matched-key == '' && steps.precompiled.outputs.restored != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            core-xprojects/OpenH264/build
            core-xprojects/OpenSSLEncryption/build
            core-xprojects/OpenSSL/build
            core-xprojects/openssl/build
            core-xprojects/libopus/build
            core-xprojects/libvpx/build
            core-xprojects/mozjpeg/build
            core-xprojects/Mozjpeg/build
            core-xprojects/libwebp/build
            core-xprojects/dav1d/build
            core-xprojects/ffmpeg/build
            core-xprojects/webrtc/build
            core-xprojects/tde2e/build
            core-xprojects/wallet-engine/build
            core-xprojects/mtproto-engine/build
            core-xprojects/tlottie/build
            packages/WalletEngine/wallet_engineFFI.xcframework
            submodules/telegram-ios/submodules/MTProtoRustEngine/MTProtoEngineFFI.xcframework
            submodules/telegram-ios/submodules/OpusBinding/SharedHeaders
            submodules/telegram-ios/submodules/FFMpegBinding/SharedHeaders
            submodules/tgcalls/SharedHeaders
            submodules/libwebp/SharedHeaders
            submodules/telegram-ios/submodules/OpenSSLEncryptionProvider/SharedHeaders
            submodules/Mozjpeg/SharedHeaders
            submodules/telegram-ios/third-party/td/TdBinding/SharedHeaders
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Prepare generated sources
        run: |
          python3 scripts/prepare-telegram-api.py
          python3 scripts/prepare-flat-serialization.py
          sh scripts/xcode27.sh apply || true
          if [[ ! -f "core-xprojects/tlottie/build/libtlottie.a" ]]; then
            echo "Building missing tlottie..."
            sh core-xprojects/tlottie/build.sh
          fi

      - name: Build Scopegram
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          xcodebuild \
            -workspace Telegram-Mac.xcworkspace \
            -scheme Telegram \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/ScopegramDerivedData" \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Prepare and sign application
        env:
          BUILD_ROOT: ${{ runner.temp }}/ScopegramDerivedData/Build/Products/Release
        run: |
          source_app="$BUILD_ROOT/Telegram.app"
          if [[ ! -d "$source_app" ]]; then
            echo "Telegram.app was not produced." >&2
            find "$BUILD_ROOT" -maxdepth 2 -type d -name "*.app" -print || true
            exit 1
          fi

          ditto "$source_app" Scopegram.app
          codesign --force --deep --timestamp=none --sign - Scopegram.app
          codesign --force --timestamp=none --sign - \
            --requirements '=designated => identifier "ru.keepcoder.Telegram"' \
            Scopegram.app
          codesign --verify --deep --strict Scopegram.app

          display_name=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" Scopegram.app/Contents/Info.plist)
          if [[ "$display_name" != "Scopegram" ]]; then
            echo "Unexpected bundle display name: $display_name" >&2
            exit 1
          fi

          for resource in \
            scopegram_developer.tgs \
            scopegram_supporter.tgs \
            scopegram_channel.tgs \
            scopegram_modicon.tgs; do
            test -s "Scopegram.app/Contents/Resources/$resource"
          done

      - name: Package release files
        run: |
          zip_name="Scopegram-macos-arm64.zip"
          dmg_name="Scopegram-macos-arm64.dmg"

          ditto -c -k --sequesterRsrc --keepParent Scopegram.app "$zip_name"

          mkdir "$RUNNER_TEMP/ScopegramDmg"
          ditto Scopegram.app "$RUNNER_TEMP/ScopegramDmg/Scopegram.app"
          ln -s /Applications "$RUNNER_TEMP/ScopegramDmg/Applications"
          hdiutil create \
            -volname Scopegram \
            -srcfolder "$RUNNER_TEMP/ScopegramDmg" \
            -format UDZO \
            -ov \
            "$dmg_name"

          shasum -a 256 "$dmg_name" "$zip_name" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scopegram-${{ steps.release.outputs.tag }}-macos-arm64
          retention-days: 14
          if-no-files-found: error
          path: |
            Scopegram-macos-arm64.dmg
            Scopegram-macos-arm64.zip
            SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          assets=(
            Scopegram-macos-arm64.dmg
            Scopegram-macos-arm64.zip
            SHA256SUMS.txt
          )

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            args=(
              "$RELEASE_TAG"
              "${assets[@]}"
              --repo "$GITHUB_REPOSITORY"
              --target "$GITHUB_SHA"
              --title "Scopegram $RELEASE_TAG"
              --generate-notes
            )
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi
