name: Build Precompiled Frameworks

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to attach tarball to'
        required: false
        default: 'precompiled-latest'

jobs:
  build-arm64:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install build tools
        run: |
          brew install cmake ninja meson nasm yasm openssl@3 zlib autoconf libtool automake pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Core Frameworks
        env:
          DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          sh scripts/setup_build_env.sh --build

      - name: Package Precompiled Artifacts
        run: |
          python3 - <<'EOF'
          import os
          import tarfile

          targets = [
              "core-xprojects/OpenH264/build",
              "core-xprojects/OpenSSLEncryption/build",
              "core-xprojects/OpenSSL/build",
              "core-xprojects/openssl/build",
              "core-xprojects/libopus/build",
              "core-xprojects/libvpx/build",
              "core-xprojects/mozjpeg/build",
              "core-xprojects/Mozjpeg/build",
              "core-xprojects/libwebp/build",
              "core-xprojects/dav1d/build",
              "core-xprojects/ffmpeg/build",
              "core-xprojects/webrtc/build",
              "core-xprojects/tde2e/build",
              "core-xprojects/wallet-engine/build",
              "core-xprojects/mtproto-engine/build",
              "packages/WalletEngine/wallet_engineFFI.xcframework",
              "submodules/telegram-ios/submodules/MTProtoRustEngine/MTProtoEngineFFI.xcframework",
              "submodules/telegram-ios/submodules/TelegramApi",
              "submodules/telegram-ios/submodules/TelegramCore/FlatSerialization/Sources",
              "submodules/telegram-ios/submodules/OpusBinding/SharedHeaders",
              "submodules/telegram-ios/submodules/FFMpegBinding/SharedHeaders",
              "submodules/tgcalls/SharedHeaders",
              "submodules/libwebp/SharedHeaders",
              "submodules/telegram-ios/submodules/OpenSSLEncryptionProvider/SharedHeaders",
              "submodules/Mozjpeg/SharedHeaders",
              "submodules/telegram-ios/third-party/td/TdBinding/SharedHeaders"
          ]

          archive_name = "precompiled-core-macos-arm64.tar.gz"
          print(f"Creating {archive_name}...")
          with tarfile.open(archive_name, "w:gz") as tar:
              for t in targets:
                  if os.path.exists(t):
                      print(f"  + Adding {t}")
                      tar.add(t)
                  else:
                      print(f"  - Skipping {t} (not found)")

          print("Packaging complete! Archive size:", os.path.getsize(archive_name))
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: precompiled-core-macos-arm64
          path: precompiled-core-macos-arm64.tar.gz

      - name: Publish GitHub Release
        if: github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.event.inputs.release_tag }}" precompiled-core-macos-arm64.tar.gz \
            --title "Precompiled Core Frameworks (${{ github.event.inputs.release_tag }})" \
            --notes "Precompiled C/C++/Rust static frameworks and headers for telegram-macos (arm64). Extract into repository root to bypass configure_frameworks.sh build time." \
            --prerelease || \
          gh release upload "${{ github.event.inputs.release_tag }}" precompiled-core-macos-arm64.tar.gz --clobber
